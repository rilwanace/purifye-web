<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Purifye — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0a;color:#e8e7e0;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center}

.chat-page{max-width:420px;width:100%;padding:0 20px 100px;position:relative;min-height:100vh}

/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;padding:21px 20px 0;max-width:420px;margin:0 auto}
.logo{font-weight:700;font-size:18px;letter-spacing:-.4px}.logo span{color:#5DCAA5}
.ham{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}

/* Slide menu */
.slide-menu{position:fixed;top:0;right:0;width:280px;height:100vh;background:#131311;border-left:1px solid rgba(255,255,255,.06);z-index:200;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding:0 24px}
.slide-menu.open{transform:translateX(0)}
.slide-menu-hdr{display:flex;justify-content:space-between;align-items:center;padding:21px 0 0}
.slide-menu-x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px}
.slide-menu-links{display:flex;flex-direction:column;gap:0;margin-top:40px}
.slide-link{font-size:16px;font-weight:600;color:#9c9b95;text-decoration:none;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.04);display:block}
.slide-link:first-child{border-top:1px solid rgba(255,255,255,.04)}
.slide-link.active{color:#5DCAA5}
.slide-link:active{color:#e8e7e0}
.slide-link-group{border-bottom:1px solid rgba(255,255,255,.04)}
.slide-link-parent{font-size:16px;font-weight:600;color:#9c9b95;padding:14px 0 8px}
.slide-sub{display:block;font-size:13px;font-weight:500;color:#6a6a64;text-decoration:none;padding:6px 0 6px 16px;position:relative}
.slide-sub::before{content:'';position:absolute;left:0;top:50%;width:8px;height:1px;background:rgba(255,255,255,.08)}
.slide-sub:last-child{padding-bottom:14px}
.slide-sub:active{color:#e8e7e0}
.slide-signin{display:block;text-align:center;margin-top:20px;padding:12px;border-radius:10px;background:rgba(93,202,165,.08);border:1px solid rgba(93,202,165,.15);color:#5DCAA5;font-size:14px;font-weight:600;text-decoration:none;transition:all .15s}
.slide-signin:active{background:rgba(93,202,165,.15)}
.slide-menu-ftr{margin-top:auto;padding:20px 0;text-align:center}
.slide-menu-ftr span{font-size:9px;color:#3a3a36;font-family:'DM Mono',monospace}
.slide-menu-backdrop{position:fixed;inset:0;background:rgba(8,8,6,.7);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s ease}
.slide-menu-backdrop.show{opacity:1;pointer-events:auto}

/* Header */
.chat-hdr{text-align:center;padding:24px 0 32px}
.chat-hdr-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#7AE4BF,#22896A);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 6px 20px rgba(93,202,165,.15)}
.chat-hdr-icon svg{width:26px;height:26px}
.chat-hdr h1{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.chat-hdr p{font-size:12px;color:#9c9b95}
.chat-hdr .online{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#5DCAA5;font-family:'DM Mono',monospace;margin-top:8px}
.chat-hdr .online-dot{width:6px;height:6px;border-radius:50%;background:#5DCAA5;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Chat area */
.chat-area{display:flex;flex-direction:column;gap:8px}

/* Messages */
.msg{max-width:85%;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;opacity:0;transform:translateY(10px);transition:all .4s cubic-bezier(.22,1,.36,1)}
.msg.show{opacity:1;transform:translateY(0)}
.msg.bot{align-self:flex-start;background:#1a1a18;border:1px solid rgba(255,255,255,.05);border-bottom-left-radius:4px;color:#e8e7e0}
.msg.user{align-self:flex-end;background:rgba(93,202,165,.08);border:1px solid rgba(93,202,165,.1);border-bottom-right-radius:4px;color:#5DCAA5;font-weight:500}
.msg .bot-tag{font-size:8px;color:#5DCAA5;font-family:'DM Mono',monospace;font-weight:600;letter-spacing:.05em;margin-bottom:4px}
.msg .typing{display:flex;gap:4px;padding:4px 0}
.msg .typing span{width:6px;height:6px;border-radius:50%;background:#5DCAA5;opacity:.3;animation:typing 1.2s ease infinite}
.msg .typing span:nth-child(2){animation-delay:.2s}
.msg .typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.8;transform:translateY(-3px)}}

/* Bot selector */
.bot-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;opacity:0;transform:translateY(10px);transition:all .4s cubic-bezier(.22,1,.36,1) .15s}
.bot-select.show{opacity:1;transform:translateY(0)}
.bot-chip{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid;display:flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent}
.bot-chip:active{transform:scale(.95)}
.bot-chip .chip-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.bot-chip.selected{opacity:1}
.bot-chip:not(.selected).faded{opacity:.3;pointer-events:none}

/* Text input area */
.input-step{opacity:0;transform:translateY(10px);transition:all .4s cubic-bezier(.22,1,.36,1)}
.input-step.show{opacity:1;transform:translateY(0)}
.input-wrap{display:flex;gap:8px;margin-top:6px}
.input-field{flex:1;background:#1a1a18;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;color:#e8e7e0;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.input-field:focus{border-color:rgba(93,202,165,.25)}
.input-field::placeholder{color:#3a3a36}
.input-send{width:40px;height:40px;border-radius:10px;background:rgba(93,202,165,.1);border:1px solid rgba(93,202,165,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.input-send:active{transform:scale(.92);background:rgba(93,202,165,.2)}
.input-send svg{width:18px;height:18px}

/* Contact method toggle */
.contact-toggle{display:flex;gap:6px;margin-top:6px;opacity:0;transform:translateY(10px);transition:all .4s cubic-bezier(.22,1,.36,1)}
.contact-toggle.show{opacity:1;transform:translateY(0)}
.toggle-btn{flex:1;padding:10px;border-radius:8px;background:#1a1a18;border:1px solid rgba(255,255,255,.06);text-align:center;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.toggle-btn:active{transform:scale(.97)}
.toggle-btn.active{border-color:rgba(93,202,165,.2);background:rgba(93,202,165,.06)}
.toggle-btn .t-icon{font-size:18px;margin-bottom:2px}
.toggle-btn .t-label{font-size:10px;color:#9c9b95;font-weight:600}
.toggle-btn.active .t-label{color:#5DCAA5}

/* Done state */
.done-card{background:#1a1a18;border-radius:14px;padding:24px;text-align:center;border:1px solid rgba(93,202,165,.1);margin-top:8px;opacity:0;transform:translateY(10px);transition:all .5s cubic-bezier(.22,1,.36,1)}
.done-card.show{opacity:1;transform:translateY(0)}
.done-check{width:48px;height:48px;border-radius:50%;background:rgba(93,202,165,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done-check svg{width:24px;height:24px}
.done-title{font-size:16px;font-weight:700;color:#5DCAA5;margin-bottom:4px}
.done-sub{font-size:12px;color:#9c9b95;line-height:1.5}
.done-back{display:inline-block;margin-top:16px;font-size:12px;color:#6a6a64;text-decoration:none;padding:8px 20px;border:1px solid rgba(255,255,255,.06);border-radius:8px;transition:all .2s}
.done-back:hover{border-color:rgba(255,255,255,.12);color:#9c9b95}
</style>
</head><body>

<div class="chat-page">

  <div class="nav">
    <div class="logo">purifye<span>AI.com</span></div>
    <div class="ham" onclick="toggleMenu()"><svg width="18" height="14" viewBox="0 0 18 14" fill="none"><line x1="0" y1="1" x2="18" y2="1" stroke="#9c9b95" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="7" x2="18" y2="7" stroke="#9c9b95" stroke-width="1.5" stroke-linecap="round"/><line x1="5" y1="13" x2="18" y2="13" stroke="#9c9b95" stroke-width="1.5" stroke-linecap="round"/></svg></div>
  </div>

  <div class="slide-menu" id="slideMenu">
    <div class="slide-menu-hdr">
      <div class="logo"><a href="/" style="color:#e8e7e0;text-decoration:none">purifye<span>AI.com</span></a></div>
      <div class="slide-menu-x" onclick="toggleMenu()"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="#9c9b95" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    </div>
    <div class="slide-menu-links">
      <a href="/" class="slide-link">Home</a>
      <div class="slide-link-group">
        <div class="slide-link-parent">Automation</div>
        <a href="/bots/accounting/" class="slide-sub">Accounts Bot</a>
        <a href="/bots/inventory/" class="slide-sub">Inventory Bot</a>
        <a href="/bots/social/" class="slide-sub">Social Bot</a>
        <a href="/bots/planner/" class="slide-sub">Planner Bot</a>
        <a href="/bots/customers/" class="slide-sub">Customer Bot</a>
      </div>
      <a href="/pricing/" class="slide-link">Pricing</a>
      <a href="/contact/" class="slide-link active">Contact</a>
      <a href="/contact/" class="slide-signin">Sign in</a>
    </div>
  </div>
  <div class="slide-menu-backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>

  <div class="chat-hdr">
    <div class="chat-hdr-icon">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 6C10.5 6 6 10.5 6 16s4.5 10 10 10 10-4.5 10-10S21.5 6 16 6z" stroke="rgba(255,255,255,.5)" stroke-width="1.5" fill="none"/><path d="M12 16l3 3 5-5" stroke="rgba(255,255,255,.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Talk to Purifye</h1>
    <p>We usually reply within a few hours</p>
    <div class="online"><span class="online-dot"></span>Online now</div>
  </div>

  <div class="chat-area" id="chatArea">
    <!-- Messages injected by JS -->
  </div>

</div>

<script>
var menuOpen=false;
function toggleMenu(){
  menuOpen=!menuOpen;
  document.getElementById('slideMenu').classList.toggle('open',menuOpen);
  document.getElementById('menuBackdrop').classList.toggle('show',menuOpen);
  document.body.style.overflow=menuOpen?'hidden':'';
}

var chat = document.getElementById('chatArea');
var step = 0;
var data = { bot: '', name: '', contact: '', contactType: 'email' };

var botOptions = [
  { id: 'accounting', name: 'Accounting', color: '#5DCAA5', bg: 'rgba(93,202,165,.08)', border: 'rgba(93,202,165,.15)' },
  { id: 'inventory', name: 'Inventory', color: '#E86B3A', bg: 'rgba(232,107,58,.06)', border: 'rgba(232,107,58,.15)' },
  { id: 'social', name: 'Social Media', color: '#7068D9', bg: 'rgba(112,104,217,.06)', border: 'rgba(112,104,217,.15)' },
  { id: 'planner', name: 'Planner', color: '#D4A843', bg: 'rgba(212,168,67,.06)', border: 'rgba(212,168,67,.15)' },
  { id: 'customer', name: 'Customer Center', color: '#CF5BA0', bg: 'rgba(207,91,160,.06)', border: 'rgba(207,91,160,.15)' },
  { id: 'all', name: 'All of them', color: '#e8e7e0', bg: 'rgba(255,255,255,.04)', border: 'rgba(255,255,255,.1)' }
];

function addBot(text, delay) {
  return new Promise(function(resolve) {
    // Show typing first
    var typing = document.createElement('div');
    typing.className = 'msg bot';
    typing.innerHTML = '<div class="bot-tag">PURIFYE</div><div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(typing);
    setTimeout(function() { typing.classList.add('show'); }, 30);

    setTimeout(function() {
      typing.innerHTML = '<div class="bot-tag">PURIFYE</div>' + text;
      resolve();
    }, delay || 1200);
  });
}

function addUser(text) {
  var msg = document.createElement('div');
  msg.className = 'msg user';
  msg.textContent = text;
  chat.appendChild(msg);
  setTimeout(function() { msg.classList.add('show'); }, 30);
  scrollDown();
}

function scrollDown() {
  setTimeout(function() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }, 100);
}

// Step 0: Greeting + bot select
function startChat() {
  addBot("Hey! 👋 Which bot are you interested in?", 800).then(function() {
    var wrap = document.createElement('div');
    wrap.className = 'bot-select';
    wrap.id = 'botSelect';

    botOptions.forEach(function(b) {
      var chip = document.createElement('div');
      chip.className = 'bot-chip';
      chip.style.background = b.bg;
      chip.style.borderColor = b.border;
      chip.style.color = b.color;
      chip.innerHTML = '<span class="chip-dot" style="background:' + b.color + '"></span>' + b.name;
      chip.onclick = function() { selectBot(b, chip); };
      wrap.appendChild(chip);
    });

    chat.appendChild(wrap);
    setTimeout(function() { wrap.classList.add('show'); scrollDown(); }, 100);
  });
}

function selectBot(bot, chip) {
  data.bot = bot.name;
  // Fade others
  var chips = document.querySelectorAll('.bot-chip');
  chips.forEach(function(c) {
    if (c !== chip) c.classList.add('faded');
    else c.classList.add('selected');
    c.style.pointerEvents = 'none';
  });

  setTimeout(function() {
    addUser(bot.name);
    setTimeout(function() { askBusiness(); }, 400);
  }, 300);
}

// Step 1: Name
function askBusiness() {
  addBot("Nice choice! Kindly fill in your name below", 1000).then(function() {
    var wrap = document.createElement('div');
    wrap.className = 'input-step';
    wrap.id = 'bizInput';
    wrap.innerHTML = '<div class="input-wrap"><input class="input-field" id="bizField" placeholder="Your name" maxlength="100"><div class="input-send" onclick="submitBiz()"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h12M12 6l4 4-4 4" stroke="#5DCAA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>';
    chat.appendChild(wrap);
    setTimeout(function() { wrap.classList.add('show'); scrollDown(); }, 100);

    document.getElementById('bizField').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitBiz();
    });
  });
}

function submitBiz() {
  var val = document.getElementById('bizField').value.trim();
  if (!val) return;
  data.name = val;

  var wrap = document.getElementById('bizInput');
  wrap.style.opacity = '0';
  wrap.style.pointerEvents = 'none';

  setTimeout(function() {
    addUser(val);
    setTimeout(function() { askContactType(); }, 400);
  }, 200);
}

// Step 2: Contact method
function askContactType() {
  addBot("And lastly, how do we reach you?", 1000).then(function() {
    var wrap = document.createElement('div');
    wrap.className = 'contact-toggle';
    wrap.id = 'contactToggle';
    wrap.innerHTML = '<div class="toggle-btn active" id="togEmail" onclick="setContactType(\'email\')"><div class="t-icon">📧</div><div class="t-label">Email</div></div><div class="toggle-btn" id="togPhone" onclick="setContactType(\'phone\')"><div class="t-icon">📱</div><div class="t-label">Phone</div></div>';
    chat.appendChild(wrap);
    setTimeout(function() { wrap.classList.add('show'); }, 100);

    // Show input right after
    setTimeout(function() { showContactInput('email'); }, 200);
  });
}

function setContactType(type) {
  data.contactType = type;
  document.getElementById('togEmail').classList.toggle('active', type === 'email');
  document.getElementById('togPhone').classList.toggle('active', type === 'phone');

  var existing = document.getElementById('contactInput');
  if (existing) existing.remove();
  showContactInput(type);
}

function showContactInput(type) {
  var ph = type === 'email' ? 'you@email.com' : '+94 7X XXX XXXX';
  var wrap = document.createElement('div');
  wrap.className = 'input-step';
  wrap.id = 'contactInput';
  wrap.innerHTML = '<div class="input-wrap"><input class="input-field" id="contactField" type="' + (type === 'email' ? 'email' : 'tel') + '" placeholder="' + ph + '" maxlength="100"><div class="input-send" onclick="submitContact()"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h12M12 6l4 4-4 4" stroke="#5DCAA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>';
  chat.appendChild(wrap);
  setTimeout(function() { wrap.classList.add('show'); scrollDown(); }, 100);

  document.getElementById('contactField').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitContact();
  });
}

function submitContact() {
  var val = document.getElementById('contactField').value.trim();
  if (!val) return;
  data.contact = val;

  // Hide inputs
  var toggle = document.getElementById('contactToggle');
  var input = document.getElementById('contactInput');
  if (toggle) { toggle.style.opacity = '0'; toggle.style.pointerEvents = 'none'; }
  if (input) { input.style.opacity = '0'; input.style.pointerEvents = 'none'; }

  setTimeout(function() {
    addUser(val);
    setTimeout(function() { finish(); }, 400);
  }, 200);
}

// Step 3: Done
function finish() {
  fetch('/api/contact', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: data.name,
      email: data.contactType === 'email' ? data.contact : '',
      phone: data.contactType === 'phone' ? data.contact : '',
      bot_interest: data.bot,
      message: ''
    })
  }).then(function(response) {
    if (response.ok) {
      addBot("Got it! We'll be in touch within 24 hours. 🚀", 1200).then(function() {
        var done = document.createElement('div');
        done.className = 'done-card';
        var checkDiv = document.createElement('div');
        checkDiv.className = 'done-check';
        checkDiv.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var titleDiv = document.createElement('div');
        titleDiv.className = 'done-title';
        titleDiv.textContent = "You're on the list, " + data.name;
        var subDiv = document.createElement('div');
        subDiv.className = 'done-sub';
        var botStrong = document.createElement('strong');
        botStrong.textContent = data.bot;
        var br = document.createElement('br');
        var contactStrong = document.createElement('strong');
        contactStrong.textContent = data.contact;
        subDiv.appendChild(botStrong);
        subDiv.appendChild(br);
        subDiv.appendChild(document.createTextNode("We'll reach you at "));
        subDiv.appendChild(contactStrong);
        var backLink = document.createElement('a');
        backLink.href = '/';
        backLink.className = 'done-back';
        backLink.textContent = '← Back to home';
        done.appendChild(checkDiv);
        done.appendChild(titleDiv);
        done.appendChild(subDiv);
        done.appendChild(backLink);
        chat.appendChild(done);
        setTimeout(function() { done.classList.add('show'); scrollDown(); }, 200);
      });
    } else {
      addBot("Something went wrong, please try again.", 600);
    }
  }).catch(function() {
    addBot("Network error, please try again.", 600);
  });
}

// Start
startChat();
</script>

</body></html>
